[project]
name = "shrinkray"
version = "26.7.8.0"
description = "Shrink Ray"
authors = [
    {name = "David R. MacIver", email = "david@drmaciver.com"}
]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.12"
dependencies = [
    # The test suite uses CliRunner(catch_exceptions=...), added in click
    # 8.2.0; 8.2.0's CliRunner fails to capture writes to sys.stderr,
    # which was fixed in 8.2.1.
    "click>=8.2.1",
    "chardet>=5.2.0",
    "trio>=0.28.0",
    "textual>=8.0.0",
    # textual-plotext < 1.0.1 is incompatible with textual >= 8.0.0
    "textual-plotext>=1.0.1",
    "humanize>=4.9.0",
    # libcst 1.8.4 is the first release with Python 3.14 wheels; older
    # versions build from sdist on 3.14 and segfault in the native parser
    "libcst>=1.8.4",
    "exceptiongroup>=1.2.0",
    "binaryornot>=0.4.4",
    "black>=24.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.12.2",
    # In-process model inference for the LLM passes (a from-source C++
    # build on platforms without wheels). On platforms where it cannot
    # load (e.g. OpenBSD) shrink ray degrades to running without the LLM
    # passes.
    "llama-cpp-python>=0.3.33",
    "huggingface-hub>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/DRMacIver/shrinkray"
Repository = "https://github.com/DRMacIver/shrinkray"
Changelog = "https://github.com/DRMacIver/shrinkray/blob/main/CHANGELOG.md"

[project.scripts]
shrinkray = "shrinkray.__main__:main"
shrinkray-worker = "shrinkray.__main__:worker_main"

[project.optional-dependencies]
# Everything needed to run the test suite. Kept separate from dev because
# the OpenBSD CI job installs only this: the lint tools in dev ship no
# OpenBSD wheels (ruff would need a huge rust build, basedpyright needs
# node binaries).
test = [
    "coverage>=7.4.0",
    # >=6.117.0 so that conftest.py's re-registration of the default
    # profile (which disables the deadline) takes effect; CI's auto "ci"
    # profile needs only 6.116.0. Versions from 6.156 on ship no sdist or
    # universal wheel, so the OpenBSD job can't install them - keep the
    # floor below that and let each platform resolve what it can.
    "hypothesis>=6.117.0",
    # >=0.3.3 because 0.3.1 predates LarkStrategy's required alphabet
    # argument and fails at import with hypothesis >= 6.117.
    "hypothesmith>=0.3.3",
    "pytest>=8.0.0",
    "pytest-trio>=0.8.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    # pytest-textual-snapshot is vendored in tests/pytest_textual_snapshot.py
    # to fix syrupy 5.0 compatibility. These are its dependencies:
    "syrupy>=5.0.0",
    "jinja2>=3.0.0",
    "coverage[toml]>=7.4.0",
    "pygments>=2.17.0",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
]
dev = [
    "shrinkray[test]",
    "basedpyright>=1.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["shrinkray"]
# Use ctrace core instead of sysmon to avoid Python 3.14 async for branch bug
core = "ctrace"

[tool.coverage.report]
show_missing = true
# fail_under is enforced in justfile to allow split parallel/serial runs

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long - handled by formatter
    "B007",  # unused loop variable
    "B023",  # function definition in loop
    "B904",  # raise without from - intentional in some exception handling
    "UP031", # use format specifiers - % format is fine
    "B018",  # useless expression - sometimes intentional for side effects
    "UP022", # prefer capture_output - explicit is fine
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["build", "bugs", ".venv", ".venv2"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# These are too noisy with third-party libraries that lack type stubs
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
# These are often false positives or stylistic
reportUnusedFunction = false
reportMissingTypeArgument = false
reportPrivateUsage = false  # Tests need to access private attributes
reportIncompatibleMethodOverride = false  # Often false positives with textual
reportUnnecessaryIsInstance = false  # Needed for runtime type checking of untrusted input

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
